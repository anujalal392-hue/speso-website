<!DOCTYPE html>
<html>
<head>
    <title>Mayank Jalal</title>
    <style>
        body {
            background: black;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        #name { 
            display: none; 
            font-size: 3rem; 
            margin-top: 20px; 
        }
        #launchBtn {
            padding: 15px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <button id="launchBtn">Launch</button>
    <div id="name">Mayank Jalal</div>

    <script>
        document.getElementById("launchBtn").onclick = function () {
            document.getElementById("launchBtn").style.display = "none";
            document.getElementById("name").style.display = "block";
        }
    </script>
</body>
</html>
