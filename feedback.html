<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Feedback – Speso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at bottom, #0b0f2a, #000);
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .rocket {
      position: absolute;
      bottom: -100px;
      left: 50%;
      width: 40px;
      height: 80px;
      background: linear-gradient(#ddd, #999);
      border-radius: 20px 20px 10px 10px;
      transform: translateX(-50%);
      animation: launch 7s linear infinite;
    }

    .rocket::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -22px;
      transform: translateX(-50%);
      width: 16px;
      height: 22px;
      background: #ff3b3b;
      border-radius: 8px 8px 0 0;
    }

    .flame {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 20px;
      background: radial-gradient(circle, #ff0, #f00);
      border-radius: 50%;
      animation: flame 0.25s infinite alternate;
    }

    @keyframes launch {
      0% { bottom: -120px; opacity: 0; }
      10% { opacity: 1; }
      100% { bottom: 110%; opacity: 0; }
    }

    @keyframes flame {
      from { height: 12px; }
      to { height: 22px; }
    }

    .container {
      position: relative;
      z-index: 5;
      max-width: 420px;
      margin: 90px auto 40px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    label {
      font-size: 13px;
      opacity: 0.9;
    }

    input, textarea {
      width: 100%;
      margin: 6px 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #ff3b3b;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,59,59,0.4);
    }

    button:hover {
      opacity: 0.9;
    }

    .note {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 10px;
      text-align: center;
      line-height: 1.4;
    }

    .back {
      display: inline-block;
      margin-top: 14px;
      color: #ccc;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="sky">
    <div class="rocket">
      <div class="flame"></div>
    </div>
  </div>

  <div class="container">
    <h1>Feedback for SPESO 🚀</h1>

    <form action="https://formspree.io/f/xdalkndd" method="POST">
      <label>Your Name (optional)</label>
      <input type="text" name="name" placeholder="Anonymous is okay">

      <label>Your Feedback</label>
      <textarea name="message" placeholder="Tell us what you think about SPESO..." required></textarea>

      <button type="submit">Send Feedback</button>
    </form>

    <div class="note">
      Your feedback goes privately to SPESO.  
      Other users cannot see it.
    </div>

    <a class="back" href="indexlike.html">← Back to Home</a>
  </div>

</body>
</html>
