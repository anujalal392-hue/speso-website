<!DOCTYPE html>
<html>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      color: white;
      font-family: Arial, sans-serif;

    h1 {

    .product-list {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 12px;
    }

    .product {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .product:last-child {
      border-bottom: none;
    }

    .soon {
      opacity: 0.7;
      font-style: italic;
    }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      border-radius: 20px;
      background: red;
      color: white;
      text-decoration: none;
